name: Day 001 Carbon Ledger

on:
  push:
    paths:
      - "challenges/day-001-data-scout-personal-carbon-ledger/**"
      - ".github/workflows/day-001-carbon-ledger.yml"
  pull_request:
    paths:
      - "challenges/day-001-data-scout-personal-carbon-ledger/**"
      - ".github/workflows/day-001-carbon-ledger.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: challenges/day-001-data-scout-personal-carbon-ledger
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: challenges/day-001-data-scout-personal-carbon-ledger/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy solution/carbon_ledger
      - run: pytest
      - run: make sample
