[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "day001-carbon-ledger-data-scout"
version = "0.1.0"
description = "Trustworthy CSV/JSON ingestion for a personal sustainability activity ledger"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Safal Gupta"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
carbon-ledger = "carbon_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["solution/carbon_ledger"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=carbon_ledger --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["solution"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["solution/carbon_ledger"]
